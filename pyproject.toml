[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ats"
version = "0.1.0"
description = "AI-Assisted Automated Trading System — MVP"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    # Core
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Database
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    # API
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    # Data
    "pandas>=2.2",
    "numpy>=1.26",
    # IBKR
    "ib_insync>=0.9.86",
    # AI
    "anthropic>=0.28",
    # AWS
    "boto3>=1.34",
    # Logging
    "structlog>=24.1",
    # HTTP
    "httpx>=0.27",
    # Config
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "black>=24.4",
    "ruff>=0.4",
    "mypy>=1.10",
]
prod = [
    "gunicorn>=22.0",
]

[project.scripts]
ats-trade = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.black]
line-length = 100
target-version = ["py312"]
