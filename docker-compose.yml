version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ats
      POSTGRES_PASSWORD: ats
      POSTGRES_DB: ats
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ats"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://ats:ats@postgres:5432/ats
      TRADING_MODE: PAPER
      TRADING_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy

  trader:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    command: python -m src.main
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://ats:ats@postgres:5432/ats
      TRADING_MODE: PAPER
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - trading  # Only starts with: docker compose --profile trading up

volumes:
  pgdata:
